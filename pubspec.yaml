name: boltin
description: "Boltin — live FX, gold, and crypto prices with AI news briefs."
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  liquid_glass_widgets: ^1.10.0
  flutter_markdown_plus: ^1.0.12
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  vibration: ^3.2.0
  http: ^1.6.0
  skeletonizer: ^2.1.3
  shimmer: ^3.0.0
  country_flags: ^4.1.2
  device_info_plus: 10.1.2
  package_info_plus: ^8.3.1
  uuid: ^4.5.1
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: IRANYekan
      fonts:
        - asset: assets/fonts/IRANYekanWebThin.ttf
          weight: 100
        - asset: assets/fonts/IRANYekanWebLight.ttf
          weight: 300
        - asset: assets/fonts/IRANYekanWebRegular.ttf
          weight: 400
        - asset: assets/fonts/IRANYekanWebMedium.ttf
          weight: 500
        - asset: assets/fonts/IRANYekanWebBold.ttf
          weight: 700
        - asset: assets/fonts/IRANYekanWebExtraBlack.ttf
          weight: 800
    - family: IRANYekanXVF
      fonts:
        - asset: assets/fonts/IRANYekanXVF.ttf
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
    - family: IRANYekanXVFaNumVF
      fonts:
        - asset: assets/fonts/IRANYekanXVFaNumVF-s.p.0-chtfn8on5ra.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/logo.jpg"
  min_sdk_android: 21
